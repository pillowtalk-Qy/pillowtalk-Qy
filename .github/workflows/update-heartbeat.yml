name: Refresh Signed Heartbeat

on:
  push:
    branches: [main]
    paths-ignore:
      - "game/public/identity.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inspect commit verification
        id: signature
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verified=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}" --jq '.commit.verification.verified')
          echo "verified=$verified" >> "$GITHUB_OUTPUT"
      - name: Write heartbeat
        if: steps.signature.outputs.verified == 'true'
        env:
          HEARTBEAT_SHA: ${{ github.sha }}
          HEARTBEAT_AT: ${{ github.event.head_commit.timestamp }}
        run: |
          node -e 'const fs = require("node:fs"); fs.writeFileSync("game/public/identity.json", JSON.stringify({sha: process.env.HEARTBEAT_SHA.slice(0, 7), at: process.env.HEARTBEAT_AT || new Date().toISOString(), mode: "signed"}, null, 2) + "\n")'
          git config user.name "identity-heartbeat[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/public/identity.json
          git commit -m "chore: refresh signed heartbeat [skip ci]"
          git push
