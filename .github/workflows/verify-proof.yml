name: Verify Minimal Disclosure Proof

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  verify:
    if: startsWith(github.event.comment.body, '/verify-zk ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json
      - name: Install verifier
        working-directory: game
        run: npm ci --omit=dev
      - name: Verify proof
        id: proof
        working-directory: game
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: node scripts/verify-comment.mjs
      - name: Publish result
        uses: actions/github-script@v8
        with:
          script: |
            const valid = '${{ steps.proof.outputs.valid }}' === 'true';
            const operator = '${{ steps.proof.outputs.operator }}';
            const body = valid
              ? `\`\`\`text\nPROOF ACCEPTED\nMINIMAL DISCLOSURE CONFIRMED\nIDENTITY NOT REQUIRED\n${operator}\n\`\`\``
              : `\`\`\`text\nPROOF REJECTED\nPOLICY 1049 NOT SATISFIED\n\`\`\``;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
